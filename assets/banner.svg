<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea" />
      <stop offset="100%" stop-color="#764ba2" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#764ba2" stop-opacity="0" />
    </linearGradient>

    <!-- Filter for Neon Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .pulse-circle {
      animation: pulse 4s ease-in-out infinite alternate;
    }
    .flow-line {
      stroke-dasharray: 8 12;
      animation: dash 25s linear infinite;
    }
    .radar-sweep {
      transform-origin: 1040px 180px;
      animation: rotate 6s linear infinite;
    }
    .float-badge {
      animation: float 5s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0% { opacity: 0.15; transform: scale(0.95); }
      100% { opacity: 0.35; transform: scale(1.05); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -1000; }
    }
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
  </style>

  <!-- Deep Tech Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" />

  <!-- Animated Ambient Glow Blobs in Background -->
  <circle class="pulse-circle" cx="200" cy="80" r="140" fill="url(#cyanPurple)" filter="url(#glow)" />
  <circle class="pulse-circle" cx="1020" cy="260" r="160" fill="url(#shieldGrad)" filter="url(#glow)" />

  <!-- Background Cyber Circuit Grid / Flow Lines -->
  <g opacity="0.18">
    <path class="flow-line" d="M 0 60 H 1200 M 0 120 H 1200 M 0 180 H 1200 M 0 240 H 1200 M 0 300 H 1200" stroke="#38bdf8" stroke-width="1" />
    <path class="flow-line" d="M 150 0 V 360 M 350 0 V 360 M 550 0 V 360 M 750 0 V 360 M 950 0 V 360" stroke="#818cf8" stroke-width="1" />
  </g>

  <!-- Interactive Dynamic Radar Scanner Widget (Right Side) -->
  <g transform="translate(1020, 180)" filter="url(#subtleGlow)">
    <circle r="110" fill="none" stroke="#1e293b" stroke-width="2" />
    <circle r="85" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5" />
    <circle r="60" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.6" />
    <circle r="35" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.8" />
    <circle r="4" fill="#00f2fe" />
    
    <!-- Radar Sweep Line -->
    <g class="radar-sweep">
      <path d="M 0 0 L 110 0 A 110 110 0 0 0 77 -77 Z" fill="url(#glowGrad)" opacity="0.4" />
      <line x1="0" y1="0" x2="110" y2="0" stroke="#00f2fe" stroke-width="2" />
    </g>

    <!-- Radar Target Nodes -->
    <circle cx="45" cy="-35" r="3.5" fill="#ef4444" filter="url(#glow)" />
    <circle cx="-50" cy="25" r="3" fill="#38bdf8" />
    <circle cx="20" cy="65" r="2.5" fill="#10b981" />
    <circle cx="-30" cy="-60" r="3" fill="#f59e0b" />
  </g>

  <!-- Floating Status Badges (Dynamic/Animated Decor) -->
  <g class="float-badge" transform="translate(80, 52)">
    <rect width="180" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1" opacity="0.85" />
    <circle cx="16" cy="14" r="5" fill="#10b981" />
    <text x="30" y="19" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">24/7 IP MONITORING</text>
  </g>

  <g class="float-badge" transform="translate(280, 52)">
    <rect width="170" height="28" rx="14" fill="#0f172a" stroke="#818cf8" stroke-width="1" opacity="0.85" />
    <circle cx="16" cy="14" r="5" fill="#38bdf8" />
    <text x="30" y="19" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">AI COPYRIGHT DETECT</text>
  </g>

  <!-- Foreground Title and Content -->
  <!-- Left Decorative Shield Icon -->
  <g transform="translate(80, 115)">
    <path d="M 0 10 Q 0 0 10 0 L 40 0 Q 50 0 50 10 L 50 45 Q 50 85 25 100 Q 0 85 0 45 Z" fill="url(#shieldGrad)" />
    <path d="M 12 25 L 22 35 L 38 18" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Main Headers (High Contrast, Bold Foreground) -->
  <text x="150" y="150" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Roboto, sans-serif" font-size="35" font-weight="800" letter-spacing="-0.5">
    Awesome Intellectual Property
  </text>
  <text x="150" y="195" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Roboto, sans-serif" font-size="33" font-weight="800" letter-spacing="-0.5">
    Infringement Monitors
  </text>

  <!-- Subtitle -->
  <text x="80" y="250" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="500">
    Curated Hub for Brand Protection • Anti-Counterfeiting • Copyright Detection • Takedown Automation
  </text>

  <!-- Feature Tags / Capabilities Row -->
  <g transform="translate(80, 278)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="165" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="14" y="20" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🛡️ Brand Protection</text>

    <!-- Pill 2 -->
    <rect x="175" y="0" width="160" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="189" y="20" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🔍 Domain Typosquat</text>

    <!-- Pill 3 -->
    <rect x="345" y="0" width="165" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="359" y="20" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚖️ Code &amp; AI Plagiarism</text>

    <!-- Pill 4 -->
    <rect x="520" y="0" width="165" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="534" y="20" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚡ Automated Takedowns</text>
  </g>
</svg>
